version: '3.8'

services:
  pii-evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-benchmark-framework
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
